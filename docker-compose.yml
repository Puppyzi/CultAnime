services:
  cultanime:
    build: .
    container_name: cultanime
    env_file:
      - .env
    environment:
      - TZ=Etc/UTC
    volumes:
      # SQLite database and config
      - /mnt/Fast_SSD/cultanime_data:/app/data
      # Anime media folder mounted read-only
      - /mnt/Storage_HDD/media/anime:/anime:ro
      # Anime movie folder mounted read-only
      - /mnt/Storage_HDD/media/anime_movies:/anime_movies:ro
    ports:
      - 3000:3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
